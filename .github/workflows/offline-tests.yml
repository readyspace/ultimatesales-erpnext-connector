name: Offline rules and adapter tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12.14', '3.14.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
      - run: python -m pip install -e '.[dev]' build setuptools wheel
      - run: python -m pytest -q
      - run: python -m compileall -q ultimatesales_connector
      - run: python -m build --no-isolation
      - run: python tools/verify_package.py dist
      - name: Check all connector browser scripts
        run: |
          find ultimatesales_connector -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
# This standalone Python matrix is not installed Frappe evidence. The separate
# installed-site workflow defines that gate; no remote run is claimed here.
