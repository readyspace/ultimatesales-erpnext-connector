name: Unchanged pinned Marketplace security rules
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install requests certifi semgrep==1.156.0
      - run: python tools/fetch_security_rules.py
      - run: python tooling/environments/scan-security.py --semgrep "$(command -v semgrep)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sanitized-security-scan
          path: docs/upstream/security-scan.json
          retention-days: 7
